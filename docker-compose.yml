services:
  backend:
    build:
      context: ./backend
    container_name: vectra-backend
    env_file:
      - ./backend/.env
    environment:
      CHATBOT_DB_PATH: /app/data/chatbot.db
      CHROMA_DIR: /app/data/chroma
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - chatbot_data:/app/data
    restart: unless-stopped

  frontend:
    container_name: vectra-frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chatbot_data:
